<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Polyfills for HTTP contexts and MQTT (MUST be inline and FIRST) -->
  <script>
    // Aggressive polyfill for crypto.randomUUID (needed for MQTT library on HTTP contexts)
    (function() {
      const randomUUID = function() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };
      
      // Ensure crypto object exists globally
      const cryptoObj = {
        randomUUID: randomUUID,
        getRandomValues: function(arr) {
          for (let i = 0; i < arr.length; i++) {
            arr[i] = Math.floor(Math.random() * 256);
          }
          return arr;
        }
      };
      
      // Patch window.crypto
      if (!window.crypto) window.crypto = cryptoObj;
      window.crypto.randomUUID = randomUUID;
      window.crypto.getRandomValues = cryptoObj.getRandomValues;
      
      // Patch self.crypto for Workers
      if (typeof self !== 'undefined') self.crypto = window.crypto;
      
      // Patch global.crypto if in node-like environment
      if (typeof global !== 'undefined') global.crypto = window.crypto;
      
      console.log('✅ Aggressive MQTT polyfills loaded');
      console.log('  window.crypto.randomUUID:', typeof window.crypto.randomUUID);
      console.log('  Can call:', typeof window.crypto.randomUUID === 'function');
    })();
  </script>

  <title>web_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
