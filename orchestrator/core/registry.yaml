variables:
  # ── Music Assistant ──────────────────────────────────────────────────────
  - name: MusicAssistantUrl
    storage: NonVolatile
    type: string
    default: '""'

  - name: MusicAssistantToken
    storage: NonVolatile
    type: string
    default: '""'

  - name: MusicAssistantTargetPlayerId
    storage: NonVolatile
    type: string
    default: '""'

  # ── Web / Network ────────────────────────────────────────────────────────
  - name: FlutterWebUrl
    storage: NonVolatile
    type: string
    default: '""'

  - name: FlutterWebPort
    storage: NonVolatile
    type: string
    default: '""'

  # ── MQTT ─────────────────────────────────────────────────────────────────
  - name: MqttBrokerHostAddress
    storage: NonVolatile
    type: string
    default: '"127.0.0.1"'

  - name: MqttWebSocketPort
    storage: NonVolatile
    type: int
    default: 9001

  - name: MqttTcpPort
    storage: NonVolatile
    type: int
    default: 1883

  # ── NFC Reader ───────────────────────────────────────────────────────────
  - name: LastKnownUidScanned
    storage: Volatile
    type: string
    default: '""'

  - name: LastUnknownUidScanned
    storage: Volatile
    type: string
    default: '""'

  - name: CurrentShelfStatus
    storage: Volatile
    type: typedefs.ShelfStatus_t
    default: "typedefs.ShelfStatus_Empty"

  - name: ReaderConnectionStatus
    storage: Volatile
    type: typedefs.ReaderStatus_t
    default: "typedefs.ReaderStatus_Offline"

  # ── Projector ────────────────────────────────────────────────────────────
  - name: CurrentProjectorData
    storage: Volatile
    type: typedefs.ProjectorData_t
    default: "typedefs.ProjectorData_t{VisualDataState: typedefs.VisualDataState_DisplayIdle}"

  - name: ProjectorHeartbeatSignal
    storage: Volatile
    type: interface{}
    default: nil

  - name: DefinedProjectorErrorMessage
    storage: Volatile
    type: string
    default: '""'

  - name: ProjectorHeartbeat
    storage: Volatile
    type: interface{}
    default: nil

  - name: TargetDisplayWidthInPixels
    storage: NonVolatile
    type: int
    default: 1920

  - name: TargetDisplayHeightInPixels
    storage: NonVolatile
    type: int
    default: 1080

  - name: CurrentMaptasticProjectorPositions
    storage: NonVolatile
    type: string
    default: '""'

  - name: SavedMaptasticProjectorPositions
    storage: NonVolatile
    type: string
    default: '""'

  # ── Active Record Shelf ──────────────────────────────────────────────────
  - name: MediaPlaybackState
    storage: Volatile
    type: typedefs.MediaPlaybackState_t
    default: "typedefs.PlayerState_Idle"

  - name: ActiveRecordTrackName
    storage: Volatile
    type: string
    default: '"Unknown"'

  - name: ActiveTrackProgressInSeconds
    storage: Volatile
    type: float64
    default: 0.0

  - name: ActiveTrackTotalDurationInSeconds
    storage: Volatile
    type: float64
    default: 0.0
