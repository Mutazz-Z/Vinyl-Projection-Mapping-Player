substitutions:
  name: tagreader
  friendly_name: TagReader
  mqtt_broker: 192.168.50.143

esphome:
  name: ${name}
  name_add_mac_suffix: true
  project:
    name: adonno.tag_reader
    version: mqtt-standalone

api:
  reboot_timeout: 0s

esp8266:
  board: d1_mini

mqtt:
  broker: ${mqtt_broker}
  topic_prefix: vinyl/shelf
  discovery: false
  on_connect:
    then:
      - logger.log: "Successfully connected to MQTT!"
  on_message:
    - topic: vinyl/shelf/command/restart
      then:
        - button.press: restart_button

wifi:
  networks:
    - ssid: "!secret wifi_ssid"
      password: "!secret wifi_password"
  ap:
    ssid: ${name}

captive_portal:

ota:
  - platform: esphome

logger:
  level: DEBUG

i2c:
  scan: False
  frequency: 400kHz

button:
  - platform: restart
    id: restart_button
    name: "${friendly_name} Restart"

pn532_i2c:
  id: pn532_board
  on_tag:
    then:
      - mqtt.publish_json:
          topic: "vinyl/shelf/tag"
          payload: |-
            root["uid"] = x;

  on_tag_removed:
    then:
      - mqtt.publish:
          topic: "vinyl/shelf/status"
          payload: "removed"
